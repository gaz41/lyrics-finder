<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Lyrics Finder</h1>

      <!-- user inputs -->
      <div class="inputs">
        <input type="text" id="artistInput" placeholder="Enter song artist" />
        <input type="text" id="songInput" placeholder="Enter song title" />
      </div>

      <!-- buttons -->
      <div class="btns">
        <button id="searchButton">Search</button>
        <button id="clearButton">Clear</button>
      </div>

      <!-- display -->
      <div id="artistDisplay"></div>
      <div id="lyricsDisplay"></div>
    </div>

    <!-- copyright info -->
    <footer>
      <div id="copy" class="copy"></div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
